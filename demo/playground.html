<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vizat 3 — Studio</title>
    <meta name="description" content="Interactive canvas studio. Drag, zoom, scale, draw lines, and connect shapes with Vizat 3." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,560&family=Outfit:wght@380;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./playground.css" />
  </head>
  <body>
    <div class="app">
      <header class="top">
        <a class="mark" href="/">Viz<span>at</span> <em>3</em></a>
        <div class="cluster" role="toolbar" aria-label="View">
          <button type="button" id="zoom-out" class="ghost" title="Zoom out">−</button>
          <button type="button" id="zoom-label" class="ghost zoom-readout" title="Reset view">100%</button>
          <button type="button" id="zoom-in" class="ghost" title="Zoom in">+</button>
          <button type="button" id="zoom-fit" class="ghost" title="Fit content">Fit</button>
          <button type="button" id="snap" class="ghost" aria-pressed="true" title="Snap to grid">Snap</button>
        </div>
        <div class="cluster" role="toolbar" aria-label="Edit">
          <button type="button" id="undo" class="ghost" title="Undo">Undo</button>
          <button type="button" id="redo" class="ghost" title="Redo">Redo</button>
          <button type="button" id="duplicate" class="ghost" title="Duplicate">Duplicate</button>
          <button type="button" id="delete" class="ghost danger" title="Delete">Delete</button>
          <button type="button" id="export" class="solid" title="Export PNG">Export</button>
        </div>
        <nav class="links">
          <a href="/docs">Docs</a>
          <a href="https://github.com/JsSuite/vizat">GitHub</a>
        </nav>
      </header>

      <aside class="tools" aria-label="Tools">
        <button type="button" data-tool="select" class="tool on" title="Select (V)">
          <svg viewBox="0 0 24 24"><path d="M6 3l12 9-6 .5L9 20z"/></svg>
        </button>
        <button type="button" data-tool="pan" class="tool" title="Pan (H)"><svg viewBox="0 0 24 24"><path d="M8 11V6.5a1.5 1.5 0 0 1 3 0V11m0-2.5a1.5 1.5 0 0 1 3 0V11m0-1.5a1.5 1.5 0 0 1 3 0V13c0 3-2 6-6 6h-1l-2.2-3.2A2 2 0 0 0 6 14.2V11a1.5 1.5 0 0 1 2 0"/></svg></button>
        <button type="button" data-tool="rect" class="tool" title="Rectangle (R)"><svg viewBox="0 0 24 24"><rect x="4" y="6" width="16" height="12" rx="2"/></svg></button>
        <button type="button" data-tool="ellipse" class="tool" title="Ellipse (O)"><svg viewBox="0 0 24 24"><ellipse cx="12" cy="12" rx="8" ry="5.5"/></svg></button>
        <button type="button" data-tool="text" class="tool" title="Text (T)"><svg viewBox="0 0 24 24"><path d="M5 6h14M12 6v13M8 19h8"/></svg></button>
        <button type="button" data-tool="line" class="tool" title="Line (L)"><svg viewBox="0 0 24 24"><path d="M5 18L18 6"/><circle cx="5" cy="18" r="1.6" fill="currentColor" stroke="none"/><circle cx="18" cy="6" r="1.6" fill="currentColor" stroke="none"/></svg></button>
        <button type="button" data-tool="arrow" class="tool" title="Arrow (A)"><svg viewBox="0 0 24 24"><path d="M5 17L16 7m0 0h-6m6 0v6"/></svg></button>
        <button type="button" data-tool="connector" class="tool" title="Connect (C)"><svg viewBox="0 0 24 24"><rect x="3" y="8" width="6" height="6" rx="1"/><rect x="15" y="10" width="6" height="6" rx="1"/><path d="M9 11h4a3 3 0 0 1 3 3v2"/></svg></button>
      </aside>

      <main id="board" aria-label="Canvas"></main>

      <aside class="inspector">
        <section>
          <h2>Properties</h2>
          <p id="prop-empty" class="muted">Select a shape, or draw one. Scroll to zoom, space to pan, handles to scale and rotate.</p>
          <form id="props" hidden>
            <label class="field for-text">Text<input id="prop-text" type="text" /></label>
            <label class="field for-text">Size<input id="prop-font" type="number" min="8" max="160" /></label>
            <label class="field for-rect">Width<input id="prop-w" type="number" min="1" /></label>
            <label class="field for-rect">Height<input id="prop-h" type="number" min="1" /></label>
            <label class="field for-radius">Radius<input id="prop-radius" type="number" min="1" /></label>
            <label class="field">Fill<input id="prop-fill" type="text" spellcheck="false" /></label>
            <label class="field">Stroke<input id="prop-stroke" type="text" spellcheck="false" /></label>
            <label class="field">Stroke width<input id="prop-sw" type="number" min="0" max="40" step="0.5" /></label>
            <label class="field">X<input id="prop-x" type="number" step="1" /></label>
            <label class="field">Y<input id="prop-y" type="number" step="1" /></label>
            <label class="field">Rotation<input id="prop-rot" type="number" step="1" /></label>
            <label class="field">Opacity<input id="prop-op" type="range" min="0.05" max="1" step="0.01" /></label>
            <div class="row-actions">
              <button type="button" id="raise" class="ghost">Forward</button>
              <button type="button" id="lower" class="ghost">Backward</button>
            </div>
          </form>
        </section>
        <section>
          <h2>Layers</h2>
          <ul id="layers"></ul>
        </section>
      </aside>

      <footer class="status">
        <span id="hint">Select · drag to move · handles scale and rotate</span>
        <span id="coords">0, 0</span>
      </footer>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
